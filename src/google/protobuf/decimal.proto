syntax = "proto3";

package google.protobuf;

option cc_enable_arenas = true;
option go_package = "google.golang.org/protobuf/types/known/decimalpb";
option java_package = "com.google.protobuf";
option java_outer_classname = "DecimalProto";
option java_multiple_files = true;
option objc_class_prefix = "GPB";
option csharp_namespace = "Google.Protobuf.WellKnownTypes";

// A Decimal represents an arbitrary-precision decimal number. It provides
// exact representation of decimal values without floating-point rounding
// errors, making it suitable for financial calculations and other
// applications requiring precision.
//
// The value is represented as: coefficient * 10^(-scale)
// For example, 123.45 is stored as coefficient=12345, scale=2.
//
// The coefficient is stored as a variable-length byte array to support
// arbitrary precision (up to 38 significant digits recommended).
//
// # Examples
//
// Example 1: Create Decimal from string in C++.
//
//     Decimal decimal;
//     DecimalUtil::FromString("123.45", &decimal);
//
// Example 2: Perform arithmetic operations.
//
//     Decimal price, quantity, total;
//     DecimalUtil::FromString("19.99", &price);
//     DecimalUtil::FromString("3", &quantity);
//     total = DecimalUtil::Multiply(price, quantity);  // 59.97
//
// Example 3: Currency calculations without precision loss.
//
//     Decimal amount, tax_rate, tax;
//     DecimalUtil::FromString("100.00", &amount);
//     DecimalUtil::FromString("0.08", &tax_rate);
//     tax = DecimalUtil::Multiply(amount, tax_rate);  // 8.00 exactly
//
// # JSON Mapping
//
// In JSON format, the Decimal type is encoded as a string to preserve
// precision:
//   "123.45"
//   "-0.001"
//   "1000000000000000000"
//
// Scientific notation is not used to avoid ambiguity.
//
message Decimal {
  // The unscaled value of the decimal as a signed integer in big-endian
  // byte order. Empty bytes array represents zero.
  // Maximum recommended size is 16 bytes (128 bits) for 38 significant digits.
  bytes coefficient = 1;

  // The scale (number of decimal places). The actual value is:
  // coefficient * 10^(-scale)
  // For example, with coefficient=12345 and scale=2, the value is 123.45.
  // Scale must be non-negative.
  int32 scale = 2;
}
