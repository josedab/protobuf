// Built-in validation constraints for Protocol Buffers.
// This file defines validation rules that can be applied to proto fields
// to generate automatic validation code in all target languages.

syntax = "proto2";

package google.protobuf;

option java_package = "com.google.protobuf";
option java_outer_classname = "ValidateProto";
option java_multiple_files = true;
option cc_enable_arenas = true;
option go_package = "google.golang.org/protobuf/types/known/validatepb";
option objc_class_prefix = "GPB";
option csharp_namespace = "Google.Protobuf.Validation";

import "google/protobuf/descriptor.proto";

// FieldRules is a container for all field-level validation rules.
// It encapsulates type-specific rules and applies to any field type.
message FieldRules {
  // Type-specific rules
  oneof type {
    // Scalar type rules
    FloatRules float = 1;
    DoubleRules double = 2;
    Int32Rules int32 = 3;
    Int64Rules int64 = 4;
    UInt32Rules uint32 = 5;
    UInt64Rules uint64 = 6;
    SInt32Rules sint32 = 7;
    SInt64Rules sint64 = 8;
    Fixed32Rules fixed32 = 9;
    Fixed64Rules fixed64 = 10;
    SFixed32Rules sfixed32 = 11;
    SFixed64Rules sfixed64 = 12;
    BoolRules bool = 13;
    StringRules string = 14;
    BytesRules bytes = 15;

    // Complex type rules
    EnumRules enum = 16;
    RepeatedRules repeated = 18;
    MapRules map = 19;

    // Well-known type rules
    AnyRules any = 20;
    DurationRules duration = 21;
    TimestampRules timestamp = 22;
  }

  // Message-level rules (applies when field is a message type)
  optional MessageRules message = 17;
}

// FloatRules describes the constraints applied to `float` values.
message FloatRules {
  // Must equal this value exactly.
  optional float const = 1;
  // Must be less than this value.
  optional float lt = 2;
  // Must be less than or equal to this value.
  optional float lte = 3;
  // Must be greater than this value.
  optional float gt = 4;
  // Must be greater than or equal to this value.
  optional float gte = 5;
  // Must be one of these values.
  repeated float in = 6;
  // Must not be one of these values.
  repeated float not_in = 7;
  // Skip validation if the field is not set (for optional fields).
  optional bool ignore_empty = 8;
}

// DoubleRules describes the constraints applied to `double` values.
message DoubleRules {
  // Must equal this value exactly.
  optional double const = 1;
  // Must be less than this value.
  optional double lt = 2;
  // Must be less than or equal to this value.
  optional double lte = 3;
  // Must be greater than this value.
  optional double gt = 4;
  // Must be greater than or equal to this value.
  optional double gte = 5;
  // Must be one of these values.
  repeated double in = 6;
  // Must not be one of these values.
  repeated double not_in = 7;
  // Skip validation if the field is not set.
  optional bool ignore_empty = 8;
}

