# MkDocs configuration for Protocol Buffers Documentation Portal
# https://squidfunk.github.io/mkdocs-material/

site_name: Protocol Buffers Documentation
site_url: https://docs.protobuf.dev/
site_description: Documentation for Protocol Buffers - Google's data interchange format
site_author: Protocol Buffers Team
repo_url: https://github.com/protocolbuffers/protobuf
repo_name: protocolbuffers/protobuf
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024 Google LLC

# Theme configuration
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: Roboto Mono

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true

# Markdown extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: protocolbuffers
      repo: protobuf
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/protocolbuffers/protobuf
    - icon: fontawesome/brands/stack-overflow
      link: https://stackoverflow.com/questions/tagged/protocol-buffers
  version:
    provider: mike
  analytics:
    provider: google
    property: G-XXXXXXXXXX

extra_css:
  - stylesheets/extra.css

# Navigation structure
nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Next Steps: getting-started/next-steps.md
  - Concepts:
    - concepts/index.md
    - Messages and Fields: concepts/messages.md
    - Wire Format: concepts/wire-format.md
    - Descriptors and Reflection: concepts/descriptors.md
    - Field Presence: concepts/field-presence.md
  - Languages:
    - languages/index.md
    - C++:
      - languages/cpp/index.md
      - Installation: languages/cpp/installation.md
      - Quick Start: languages/cpp/quickstart.md
      - API Reference: languages/cpp/api-reference.md
      - Best Practices: languages/cpp/best-practices.md
    - Java:
      - languages/java/index.md
      - Installation: languages/java/installation.md
      - Quick Start: languages/java/quickstart.md
      - API Reference: languages/java/api-reference.md
      - Best Practices: languages/java/best-practices.md
    - Python:
      - languages/python/index.md
      - Installation: languages/python/installation.md
      - Quick Start: languages/python/quickstart.md
      - API Reference: languages/python/api-reference.md
      - Best Practices: languages/python/best-practices.md
  - Architecture:
    - architecture/index.md
    - Overview: architecture/overview.md
    - Compiler Pipeline: architecture/compiler.md
    - Runtime Libraries: architecture/runtime.md
    - Key Files Reference: architecture/key-files.md
  - API Reference:
    - api/index.md
  - Contributing:
    - contributing/index.md
    - Development Setup: contributing/setup.md
    - Code Style: contributing/style.md
    - Testing Guide: contributing/testing.md
    - Pull Request Process: contributing/pull-requests.md
  - Legacy Docs:
    - Field Presence: field_presence.md
    - Proto3 Presence: implementing_proto3_presence.md
    - Options: options.md
    - Build Systems: cpp_build_systems.md
    - CMake Generate: cmake_protobuf_generate.md
    - Third Party: third_party.md
